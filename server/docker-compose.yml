services:
  postgres:
    image: postgres:17
    container_name: object-storage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: object_storage
      POSTGRES_USER: storage_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage_app -d object_storage"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: object-storage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Malware scanner for the processing worker (clamd INSTREAM on 3310).
  # The first start downloads signatures and takes a few minutes.
  clamav:
    image: clamav/clamav:1.4
    container_name: object-storage-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  # Local SQS-compatible queue for the event pipeline (outbox publisher and
  # consumers). Queues are created by the workers when SQS_CREATE_QUEUES is
  # true; nothing is persisted across restarts, the outbox is the source of
  # truth.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    container_name: object-storage-elasticmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"

  # Storage emulators for the bring-your-own-storage adapter tests
  # (Phase 11). Opt-in: `docker compose --profile emulators up -d`. They
  # hold nothing worth keeping and are never part of the default stack.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: object-storage-fake-gcs
    profiles: ["emulators"]
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443", "-external-url", "http://127.0.0.1:4443"]
    ports:
      - "127.0.0.1:4443:4443"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    container_name: object-storage-azurite
    profiles: ["emulators"]
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck", "--loose"]
    ports:
      - "127.0.0.1:10000:10000"

volumes:
  postgres_data:
  minio_data:
  clamav_data: